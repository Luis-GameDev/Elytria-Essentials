# Custom natural regeneration replacement
# This only runs in worlds where gamerule naturalRegeneration is false.
custom-regeneration:
  enabled: true
  # 1.0 HP = half a heart in Minecraft.
  heal-amount-hp: 1.0
  food-loss:
    enabled: true
    # Consumed food points per 1.0 HP healed when the player is at 1 hunger bar (food level 2).
    food-points-per-hp-at-one-hunger-bar: 0.1
    # Consumed food points per 1.0 HP healed when the player is at max hunger bars (food level 20).
    food-points-per-hp-at-max-hunger-bars: 0.4
    # True = consume saturation first (vanilla-like), then food level.
    use-saturation-first: true
  intervals:
    # food level 20
    full-hunger-seconds: 3
    # food level 15-19
    high-hunger-seconds: 5
    # food level 10-14
    medium-hunger-seconds: 15
  # Optional per-world overrides (true = allow custom regen in that world when gamerule is false).
  world-overrides:
    world: true
    world_nether: true
    world_the_end: true

